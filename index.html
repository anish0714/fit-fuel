<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        // Restore the real path after the 404.html redirect (see public/404.html)
        // so React Router mounts on the intended route, not on "/".
        var params = new URLSearchParams(location.search);
        var redirect = params.get("redirect");
        if (redirect) {
          var basePath = "/fit-fuel/";
          history.replaceState(null, "", basePath + redirect);
        }
      })();
    </script>
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var theme =
          stored ||
          (window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark");
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fit Fuel — a high-protein, lactose-free meal planner built around a 12-8 intermittent fasting window, with a recipe library, a weekly meal-plan calendar, and a persistent shopping list."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Fit Fuel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
